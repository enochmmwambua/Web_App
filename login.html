<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Evolve Fitness Langata</title>
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body class="auth-body">
    
    <nav class="main-nav auth-nav">
        <div class="logo">Evolve Fitness</div>
        <div class="nav-links">
            <a href="index.html">← Back to Home</a>
        </div>
    </nav>

    <div class="auth-container">
        <div class="auth-card">
            <h2>Welcome Back</h2>
            <p>Sign in to access your GymBuddy splits and manage your membership.</p>
            
            <form id="loginForm" class="auth-form">
                <div class="input-group">
                    <input type="email" id="loginEmail" placeholder="Email Address" required>
                </div>
                <div class="input-group">
                    <input type="password" id="loginPassword" placeholder="Password" required>
                </div>

                <button type="submit" class="cta-btn full-width" id="loginBtn">Log In</button>
            </form>

            <div class="auth-footer">
                <p>Don't have an account yet? <a href="signup.html">Join Now</a></p>
            </div>
        </div>
    </div>
    
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            const btn = document.getElementById('loginBtn');

            btn.disabled = true;
            btn.innerText = 'Signing in...';

            try {
                const API_BASE = window.location.port === '5500' || window.location.protocol === 'file:'
                    ? 'http://localhost:5000' 
                    : '';

                const response = await fetch(`${API_BASE}/api/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Authentication failed.');
                }

                // Store session and redirect to profile dashboard
                localStorage.setItem('gymUser', JSON.stringify(data.user));
                window.location.href = 'profile.html';
            } catch (err) {
                alert(err.message);
            } finally {
                btn.disabled = false;
                btn.innerText = 'Log In';
            }
        });
    </script>
</body>
</html>
