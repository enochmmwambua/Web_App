openapi: 3.0.0
info:
  title: GymBuddy API
  version: 1.0.0
  description: Public-facing endpoints for downstream partners (NyumbaHub) to access gym amenities, staff, and pricing, plus system metrics.
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
paths:
  /memberships:
    get:
      summary: Return all active gym membership tiers and pricing
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: A list of active membership tiers
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                    - tier
                    - price
                    - details
                  properties:
                    tier:
                      type: string
                      example: "Monthly Standard"
                    price:
                      type: string
                      example: "5,000 KES"
                    details:
                      type: string
                      example: "Unlimited access + GymBuddy App."
  /users:
    post:
      summary: Register a new tenant as a GymBuddy user
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - fullName
                - email
                - tier
                - password
              properties:
                fullName:
                  type: string
                  example: "John Otieno"
                email:
                  type: string
                  format: email
                  example: "john@example.com"
                phone:
                  type: string
                  example: "0700123456"
                tier:
                  type: string
                  example: "Monthly Standard"
                password:
                  type: string
                  format: password
                  example: "SecurePass123!"
      responses:
        '201':
          description: User created successfully
        '400':
          description: Email already exists or invalid payload
  /trainers:
    get:
      summary: Return active personal trainers and their specializations
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: A list of active personal trainers
  /testimonials:
    get:
      summary: Return verified member success stories for social proof
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: A list of member testimonials
  /schedules:
    get:
      summary: Return group class schedules to highlight community events
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: A list of group class schedules
  /hours:
    get:
      summary: Return gym operating hours and facility availability
      security:
        - ApiKeyAuth: []
      parameters:
        - name: status
          in: query
          description: Filter to check if the facility is currently open
          required: false
          schema:
            type: string
            enum: [open]
      responses:
        '200':
          description: Operating hours and open status
  /stats:
    get:
      summary: Return live operational performance metrics and error rates
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Server metrics and route latency totals