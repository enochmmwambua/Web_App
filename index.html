<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GymBuddy</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <header>
            <h1>GymBuddy</h1>
            <p>Your Personal Barbell Assistant</p>
        </header>

        <main class="calculator-card">
            <h2>Barbell Loader</h2>
            <div class="input-group">
                <input type="number" id="targetWeight" placeholder="Enter weight (e.g., 160)" min="20">
                <button id="calcBtn">Calculate</button>
            </div>

            <div class="barbell-container">
                <div class="barbell-shaft"></div>
                <div id="plateDisplay" class="plates-wrapper">
                    </div>
            </div>
            
            <p id="textFeedback" class="feedback-text">Enter weight to view plate breakdown on the bar.</p>
        </main>

        <section class="routine-grid">
            <div class="day-card">
                <h3>Push Day</h3>
                <label><input type="checkbox" class="task-check"> Seated Machine Chest Press</label>
                <label><input type="checkbox" class="task-check"> Incline Dumbbell Press</label>
                <label><input type="checkbox" class="task-check"> Tricep Pushdowns</label>
            </div>
            <div class="day-card">
                <h3>Pull Day</h3>
                <label><input type="checkbox" class="task-check"> Deadlift (Target: 160kg)</label>
                <label><input type="checkbox" class="task-check"> Lat Pulldowns</label>
                <label><input type="checkbox" class="task-check"> Bicep Curls</label>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
